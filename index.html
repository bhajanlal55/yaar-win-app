<style>
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
}

:root {
  --gold-deep: #8a6508;
  --gold: #c59b27;
  --gold-light: #f3cf65;
  --gold-glow: rgba(212, 160, 23, 0.45);
  --gold-bg: #fffdf9;
  --gold-border: rgba(184, 134, 11, 0.25);
  --dark: #140d05;
  --muted: #8c7353;
  --accent-bg: #fffaf0;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 18px;
  background: radial-gradient(circle at 50% 10%, #ffffff 0%, #faf3e0 60%, #f4e6c3 100%);
  font-family: 'DM Sans', sans-serif;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: -15%;
  right: -15%;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(243, 207, 101, 0.22) 0%, transparent 65%);
  pointer-events: none;
  border-radius: 50%;
}
body::after {
  content: '';
  position: fixed;
  bottom: -15%;
  left: -15%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(184, 134, 11, 0.15) 0%, transparent 65%);
  pointer-events: none;
  border-radius: 50%;
}

.card {
  position: relative;
  z-index: 1;
  width: 92%;
  max-width: 360px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border: 1.5px solid var(--gold-border);
  border-radius: 30px;
  padding: 22px 20px 18px;
  text-align: center;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.9) inset,
    0 25px 60px rgba(184, 134, 11, 0.18),
    0 6px 20px rgba(0, 0, 0, 0.05);
  animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold-light), var(--gold), transparent);
  border-radius: 4px;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(35px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.profile-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 12px;
  margin-top: 2px;
}

.profile-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: conic-gradient(var(--gold-light), #fff0b8, var(--gold), #d49a17, var(--gold-light));
  animation: spin 5s linear infinite;
  box-shadow: 0 0 16px var(--gold-glow);
}

.profile-ring::after {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: #fff;
}

@keyframes spin { to { transform: rotate(360deg); } }

.profile {
  position: relative;
  z-index: 1;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

.official-badge {

.divider {

.stats {

.live-badge {

.live-dot {

}

@keyframes blink {

.timer-wrap {

.timer-label {

.timer {

.cta-btn::before {

@keyframes sheen {

@keyframes shimmer {

@keyframes pulseGold {

.cta-btn:hover {

.foot-note {

.foot-note span {

}
</style>
